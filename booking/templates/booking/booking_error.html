{% extends 'booking/base.html' %}

{% block title %}Booking error{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-danger shadow-sm">
                <div class="card-header text-bg-danger">Booking error</div>
                <div class="card-body p-4">
                    <h1 class="h3 card-title">Could not create booking</h1>
                    <p class="card-text text-body-secondary mb-4">{{ error }}</p>
                    <a class="btn btn-primary" href="{% url 'make_booking' %}">Try again</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
