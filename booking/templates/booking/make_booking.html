{% extends 'booking/base.html' %}

{% block title %}Make Booking{% endblock %}

{% block content %}
    <h1>Make a booking</h1>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label>Username:</label>
            <input type="text" value="{{ request.user.username }}" readonly>
        </div>

        <div>
            <label>Email:</label>
            <input type="email" value="{{ request.user.email }}" readonly>
        </div>

        <div>
            <label for="room_number">Room:</label>
            <select id="room_number" name="room_number" required>
                {% for room in rooms %}
                    <option value="{{ room.room_number }}" {% if room.room_number == selected_room %}selected{% endif %}>
                        {{ room }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="datetime_start">Start:</label>
            <input type="datetime-local" id="datetime_start" name="datetime_start" required>
        </div>

        <div>
            <label for="datetime_end">End:</label>
            <input type="datetime-local" id="datetime_end" name="datetime_end" required>
        </div>

        <button type="submit">Book room</button>
    </form>
{% endblock %}
