<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Booking Service{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand bg-white border-bottom">
        <div class="container flex-wrap">
            <a class="navbar-brand" href="{% url 'room_list' %}">Booking Service</a>

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'room_list' %}">Rooms</a>
                <a class="nav-link" href="{% url 'make_booking' %}">Make booking</a>
                <a class="nav-link" href="{% url 'my_bookings' %}">My bookings</a>
            </div>

            {% if user.is_authenticated %}
                <span class="navbar-text">{{ user.username }}</span>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
