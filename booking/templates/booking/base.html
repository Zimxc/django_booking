<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Booking Service{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <nav class="navbar navbar-expand-md navbar-dark shadow-sm" style="background: linear-gradient(135deg, #32175a, #160b28);">
        <div class="container flex-wrap">
            <a class="navbar-brand fw-semibold" href="{% url 'room_list' %}">Booking Service</a>

            <div class="navbar-nav me-auto gap-md-1">
                <a class="nav-link{% if request.resolver_match.url_name == 'room_list' %} active fw-semibold{% endif %}" href="{% url 'room_list' %}">Rooms</a>
                <a class="nav-link{% if request.resolver_match.url_name == 'make_booking' %} active fw-semibold{% endif %}" href="{% url 'make_booking' %}">Make booking</a>
                <a class="nav-link{% if request.resolver_match.url_name == 'my_bookings' %} active fw-semibold{% endif %}" href="{% url 'my_bookings' %}">My bookings</a>
            </div>

            {% if user.is_authenticated %}
                <span class="navbar-text text-white-50">Signed in as <strong class="text-white">{{ user.username }}</strong></span>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
